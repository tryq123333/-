name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Expand Android source archive
        run: unzip -q LuokeAutoPiano.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: LuokeAutoPiano
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run JVM tests
        working-directory: LuokeAutoPiano
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-debug-apk
          path: LuokeAutoPiano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

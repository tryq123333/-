name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Expand Android source archive
        run: unzip -q LuokeAutoPiano.zip

      - name: Apply earlier video-inspired MIDI roll changes when needed
        run: |
          if [ ! -f LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java ]; then
            cat video-patch-b64/part-*.txt | tr -d '\r\n\t ' > /tmp/video-optimization.patch.gz.b64
            base64 --decode /tmp/video-optimization.patch.gz.b64 > /tmp/video-optimization.patch.gz
            gzip -t /tmp/video-optimization.patch.gz
            gzip -dc /tmp/video-optimization.patch.gz > /tmp/video-optimization.patch
            patch --dry-run -p1 < /tmp/video-optimization.patch
            patch -p1 < /tmp/video-optimization.patch
          else
            echo "The source archive already contains the video-inspired optimization."
          fi

      - name: Apply resizable, seekable roll and song-list updates when needed
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'private boolean scrubbing;' "$NOTE_VIEW"; then
            cat overlay-patch-b64/part-*.txt | tr -d '\r\n\t ' > /tmp/overlay-optimization.patch.gz.b64
            base64 --decode /tmp/overlay-optimization.patch.gz.b64 > /tmp/overlay-optimization.patch.gz
            gzip -t /tmp/overlay-optimization.patch.gz
            gzip -dc /tmp/overlay-optimization.patch.gz > /tmp/overlay-optimization.patch
            patch --dry-run -p1 < /tmp/overlay-optimization.patch
            patch -p1 < /tmp/overlay-optimization.patch
          else
            echo "The source archive already contains the resizable and seekable roll."
          fi
          grep -q 'private boolean scrubbing;' "$NOTE_VIEW" || sed -i '/private boolean playing;/a\    private boolean scrubbing;' "$NOTE_VIEW"
          grep -q 'private boolean scrubbing;' "$NOTE_VIEW"

      - name: Set compact default note-roll width
        run: |
          SERVICE=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java
          sed -i 's/screenWidth \* \.48f/screenWidth * .38f/' "$SERVICE"
          grep -q 'screenWidth \* \.38f' "$SERVICE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: LuokeAutoPiano
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run JVM tests
        working-directory: LuokeAutoPiano
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-debug-apk
          path: LuokeAutoPiano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package optimized source archive
        run: |
          find LuokeAutoPiano -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          rm -f /tmp/LuokeAutoPiano.zip
          zip -qr -9 /tmp/LuokeAutoPiano.zip LuokeAutoPiano
          unzip -tq /tmp/LuokeAutoPiano.zip
          cp /tmp/LuokeAutoPiano.zip LuokeAutoPiano.zip

      - name: Upload optimized source archive
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-source-zip
          path: LuokeAutoPiano.zip
          if-no-files-found: error

      - name: Upload optimized source archive
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-source-zip
          path: LuokeAutoPiano.zip
          if-no-files-found: error

      - name: Sync optimized source archive back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch video-patch video-patch-b64 overlay-patch-b64
          git add LuokeAutoPiano.zip
          if ! git diff --cached --quiet; then
            git commit -m "Sync seekable music overlay source [skip ci]"
            git push origin HEAD:main
          else
            echo "No source archive changes to sync."
          fi

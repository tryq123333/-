name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Expand Android source archive
        run: unzip -q LuokeAutoPiano.zip

      - name: Apply earlier video-inspired MIDI roll changes when needed
        run: |
          if [ ! -f LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java ]; then
            cat video-patch-b64/part-*.txt | tr -d '\r\n\t ' > /tmp/video-optimization.patch.gz.b64
            base64 --decode /tmp/video-optimization.patch.gz.b64 > /tmp/video-optimization.patch.gz
            gzip -t /tmp/video-optimization.patch.gz
            gzip -dc /tmp/video-optimization.patch.gz > /tmp/video-optimization.patch
            patch --dry-run -p1 < /tmp/video-optimization.patch
            patch -p1 < /tmp/video-optimization.patch
          else
            echo "The source archive already contains the video-inspired optimization."
          fi

      - name: Apply resizable, seekable roll and song-list updates when needed
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'private boolean scrubbing;' "$NOTE_VIEW"; then
            cat overlay-patch-b64/part-*.txt | tr -d '\r\n\t ' > /tmp/overlay-optimization.patch.gz.b64
            base64 --decode /tmp/overlay-optimization.patch.gz.b64 > /tmp/overlay-optimization.patch.gz
            gzip -t /tmp/overlay-optimization.patch.gz
            gzip -dc /tmp/overlay-optimization.patch.gz > /tmp/overlay-optimization.patch
            patch --dry-run -p1 < /tmp/overlay-optimization.patch
            patch -p1 < /tmp/overlay-optimization.patch
          else
            echo "The source archive already contains the resizable and seekable roll."
          fi
          grep -q 'private boolean scrubbing;' "$NOTE_VIEW" || sed -i '/private boolean playing;/a\    private boolean scrubbing;' "$NOTE_VIEW"
          grep -q 'private boolean scrubbing;' "$NOTE_VIEW"

      - name: Keep the note-roll default compact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java")
          source = path.read_text(encoding="utf-8")
          if "screenWidth * .32f" not in source:
              if "screenWidth * .38f" in source:
                  source = source.replace("screenWidth * .38f", "screenWidth * .32f", 1)
              elif "screenWidth * .48f" in source:
                  source = source.replace("screenWidth * .48f", "screenWidth * .32f", 1)
              else:
                  raise SystemExit("Could not find the expected note-roll default width expression.")
              path.write_text(source, encoding="utf-8")
          if "screenWidth * .32f" not in path.read_text(encoding="utf-8"):
              raise SystemExit("Compact note-roll width was not applied.")
          PY

      - name: Apply floating-panel and note-roll refinements when needed
        run: |
          LAYOUT=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/AdaptiveFlowLayout.java
          if [ ! -f "$LAYOUT" ]; then
            cat .github/patches/ui-refinements.part-*.txt | tr -d '\r\n\t ' > /tmp/ui-refinements.patch.gz.b64
            base64 --decode /tmp/ui-refinements.patch.gz.b64 > /tmp/ui-refinements.patch.gz
            gzip -t /tmp/ui-refinements.patch.gz
            gzip -dc /tmp/ui-refinements.patch.gz > /tmp/ui-refinements.patch
            patch --dry-run -p1 -d LuokeAutoPiano < /tmp/ui-refinements.patch
            patch -p1 -d LuokeAutoPiano < /tmp/ui-refinements.patch
          else
            echo "Floating-panel and note-roll refinements are already in the source archive."
          fi

      - name: Use a wider one-row default for the control panel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java")
          source = path.read_text(encoding="utf-8")
          if 'control_overlay_resize_v3' not in source:
              replacements = [
                  ('boolean layoutV2 = prefs.getBoolean("control_overlay_resize_v2", false);',
                   'boolean layoutV3 = prefs.getBoolean("control_overlay_resize_v3", false);'),
                  ('int defaultWidth = Math.min(maxWidth, dp(400));',
                   'int defaultWidth = Math.min(maxWidth, dp(500));'),
                  ('int width = layoutV2 ? prefs.getInt("control_width_px", defaultWidth) : defaultWidth;',
                   'int width = layoutV3 ? prefs.getInt("control_width_px", defaultWidth) : defaultWidth;'),
                  ('int storedHeight = layoutV2 ? prefs.getInt("control_height_px", WindowManager.LayoutParams.WRAP_CONTENT)',
                   'int storedHeight = layoutV3 ? prefs.getInt("control_height_px", WindowManager.LayoutParams.WRAP_CONTENT)'),
                  ('putBoolean("control_overlay_resize_v2", true)',
                   'putBoolean("control_overlay_resize_v3", true)'),
              ]
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit("Missing expected control-panel source line: " + old)
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          if 'control_overlay_resize_v3' not in path.read_text(encoding="utf-8"):
              raise SystemExit("Control-panel migration marker was not written.")
          PY

      - name: Apply unified note-roll header, range editing, and stable drag
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'onPracticeRangeChange' "$NOTE_VIEW"; then
            cat .github/patches/ui-refinements-v2.part-*.txt | tr -d '\r\n\t ' > /tmp/ui-refinements-v2.patch.gz.b64
            base64 --decode /tmp/ui-refinements-v2.patch.gz.b64 > /tmp/ui-refinements-v2.patch.gz
            gzip -t /tmp/ui-refinements-v2.patch.gz
            gzip -dc /tmp/ui-refinements-v2.patch.gz > /tmp/ui-refinements-v2.patch
            patch --dry-run -p1 -d LuokeAutoPiano < /tmp/ui-refinements-v2.patch
            patch -p1 -d LuokeAutoPiano < /tmp/ui-refinements-v2.patch
          else
            echo "Unified note-roll header and integrated range editing are already in the source archive."
          fi

      - name: Refine note-roll playhead fade and close interaction
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'NOTE_ROLL_HEADER_ANCHOR_V1' "$NOTE_VIEW"; then
            python .github/scripts/apply_note_roll_header_v1.py
          else
            echo "Note-roll header, playhead fade and close hit zones are already in the source archive."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: LuokeAutoPiano
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run JVM tests
        working-directory: LuokeAutoPiano
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-debug-apk
          path: LuokeAutoPiano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package optimized source archive
        run: |
          find LuokeAutoPiano -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          rm -f /tmp/LuokeAutoPiano.zip
          zip -qr -9 /tmp/LuokeAutoPiano.zip LuokeAutoPiano
          unzip -tq /tmp/LuokeAutoPiano.zip
          cp /tmp/LuokeAutoPiano.zip LuokeAutoPiano.zip

      - name: Upload optimized source archive
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-source-zip
          path: LuokeAutoPiano.zip
          if-no-files-found: error

      - name: Sync optimized source archive back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch video-patch video-patch-b64 overlay-patch-b64 .github/patches .github/scripts/apply_note_roll_header_v1.py
          git add LuokeAutoPiano.zip
          if ! git diff --cached --quiet; then
            git commit -m "Sync seekable music overlay source [skip ci]"
            git push origin HEAD:main
          else
            echo "No source archive changes to sync."
          fi

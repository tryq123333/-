name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Expand Android source archive
        run: unzip -q LuokeAutoPiano.zip

      - name: Apply earlier video-inspired MIDI roll changes when needed
        run: |
          if [ ! -f LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java ]; then
            cat video-patch-b64/part-*.txt | tr -d '\r\n\t ' > /tmp/video-optimization.patch.gz.b64
            base64 --decode /tmp/video-optimization.patch.gz.b64 > /tmp/video-optimization.patch.gz
            gzip -t /tmp/video-optimization.patch.gz
            gzip -dc /tmp/video-optimization.patch.gz > /tmp/video-optimization.patch
            patch --dry-run -p1 < /tmp/video-optimization.patch
            patch -p1 < /tmp/video-optimization.patch
          else
            echo "The source archive already contains the video-inspired optimization."
          fi

      - name: Apply resizable, seekable roll and song-list updates when needed
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'private boolean scrubbing;' "$NOTE_VIEW"; then
            cat overlay-patch-b64/part-*.txt | tr -d '\r\n\t ' > /tmp/overlay-optimization.patch.gz.b64
            base64 --decode /tmp/overlay-optimization.patch.gz.b64 > /tmp/overlay-optimization.patch.gz
            gzip -t /tmp/overlay-optimization.patch.gz
            gzip -dc /tmp/overlay-optimization.patch.gz > /tmp/overlay-optimization.patch
            patch --dry-run -p1 < /tmp/overlay-optimization.patch
            patch -p1 < /tmp/overlay-optimization.patch
          else
            echo "The source archive already contains the resizable and seekable roll."
          fi
          grep -q 'private boolean scrubbing;' "$NOTE_VIEW" || sed -i '/private boolean playing;/a\    private boolean scrubbing;' "$NOTE_VIEW"
          grep -q 'private boolean scrubbing;' "$NOTE_VIEW"

      - name: Keep the note-roll default compact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java")
          source = path.read_text(encoding="utf-8")
          if "screenWidth * .32f" not in source:
              if "screenWidth * .38f" in source:
                  source = source.replace("screenWidth * .38f", "screenWidth * .32f", 1)
              elif "screenWidth * .48f" in source:
                  source = source.replace("screenWidth * .48f", "screenWidth * .32f", 1)
              else:
                  raise SystemExit("Could not find the expected note-roll default width expression.")
              path.write_text(source, encoding="utf-8")
          if "screenWidth * .32f" not in path.read_text(encoding="utf-8"):
              raise SystemExit("Compact note-roll width was not applied.")
          PY

      - name: Apply floating-panel and note-roll refinements when needed
        run: |
          LAYOUT=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/AdaptiveFlowLayout.java
          if [ ! -f "$LAYOUT" ]; then
            cat .github/patches/ui-refinements.part-*.txt | tr -d '\r\n\t ' > /tmp/ui-refinements.patch.gz.b64
            base64 --decode /tmp/ui-refinements.patch.gz.b64 > /tmp/ui-refinements.patch.gz
            gzip -t /tmp/ui-refinements.patch.gz
            gzip -dc /tmp/ui-refinements.patch.gz > /tmp/ui-refinements.patch
            patch --dry-run -p1 -d LuokeAutoPiano < /tmp/ui-refinements.patch
            patch -p1 -d LuokeAutoPiano < /tmp/ui-refinements.patch
          else
            echo "Floating-panel and note-roll refinements are already in the source archive."
          fi

      - name: Use a wider one-row default for the control panel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java")
          source = path.read_text(encoding="utf-8")
          if 'control_overlay_resize_v3' not in source:
              replacements = [
                  ('boolean layoutV2 = prefs.getBoolean("control_overlay_resize_v2", false);',
                   'boolean layoutV3 = prefs.getBoolean("control_overlay_resize_v3", false);'),
                  ('int defaultWidth = Math.min(maxWidth, dp(400));',
                   'int defaultWidth = Math.min(maxWidth, dp(500));'),
                  ('int width = layoutV2 ? prefs.getInt("control_width_px", defaultWidth) : defaultWidth;',
                   'int width = layoutV3 ? prefs.getInt("control_width_px", defaultWidth) : defaultWidth;'),
                  ('int storedHeight = layoutV2 ? prefs.getInt("control_height_px", WindowManager.LayoutParams.WRAP_CONTENT)',
                   'int storedHeight = layoutV3 ? prefs.getInt("control_height_px", WindowManager.LayoutParams.WRAP_CONTENT)'),
                  ('putBoolean("control_overlay_resize_v2", true)',
                   'putBoolean("control_overlay_resize_v3", true)'),
              ]
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit("Missing expected control-panel source line: " + old)
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          if 'control_overlay_resize_v3' not in path.read_text(encoding="utf-8"):
              raise SystemExit("Control-panel migration marker was not written.")
          PY

      - name: Apply unified note-roll header, range editing, and stable drag
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'onPracticeRangeChange' "$NOTE_VIEW"; then
            cat .github/patches/ui-refinements-v2.part-*.txt | tr -d '\r\n\t ' > /tmp/ui-refinements-v2.patch.gz.b64
            base64 --decode /tmp/ui-refinements-v2.patch.gz.b64 > /tmp/ui-refinements-v2.patch.gz
            gzip -t /tmp/ui-refinements-v2.patch.gz
            gzip -dc /tmp/ui-refinements-v2.patch.gz > /tmp/ui-refinements-v2.patch
            patch --dry-run -p1 -d LuokeAutoPiano < /tmp/ui-refinements-v2.patch
            patch -p1 -d LuokeAutoPiano < /tmp/ui-refinements-v2.patch
          else
            echo "Unified note-roll header and integrated range editing are already in the source archive."
          fi

      - name: Refine note-roll playhead fade and close interaction
        run: |
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'NOTE_ROLL_HEADER_ANCHOR_V1' "$NOTE_VIEW"; then
            python .github/scripts/apply_note_roll_header_v1.py
          else
            echo "Note-roll header, playhead fade and close hit zones are already in the source archive."
          fi

      - name: Apply player status pill and clean floating note blocks
        run: |
          SERVICE=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java
          if ! grep -q 'COLLAPSED_MUSIC_STATUS_BUBBLE_V1' "$SERVICE"; then
            cat .github/patches/status-note-roll-v1.part-*.txt | tr -d '\r\n\t ' > /tmp/status-note-roll-v1.patch.gz.b64
            base64 --decode /tmp/status-note-roll-v1.patch.gz.b64 > /tmp/status-note-roll-v1.patch.gz
            gzip -t /tmp/status-note-roll-v1.patch.gz
            gzip -dc /tmp/status-note-roll-v1.patch.gz > /tmp/status-note-roll-v1.patch
            patch --dry-run -p1 -d LuokeAutoPiano < /tmp/status-note-roll-v1.patch
            patch -p1 -d LuokeAutoPiano < /tmp/status-note-roll-v1.patch
          else
            echo "The player status pill and floating note styling are already applied."
          fi

      - name: Ensure collapsed music icon field exists
        run: |
          SERVICE=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java
          if ! grep -q 'private TextView collapsedMusicIcon;' "$SERVICE"; then
            patch --dry-run -p1 -d LuokeAutoPiano < .github/patches/status-bubble-field-fix.patch
            patch -p1 -d LuokeAutoPiano < .github/patches/status-bubble-field-fix.patch
          else
            echo "Collapsed music icon field is already present."
          fi

      - name: Apply top-left floating overlay, calibration gate, and note header
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java")
          note_path = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java")

          def rep(source, old, new, label):
              if old not in source:
                  raise SystemExit("Cannot apply " + label + ": source anchor not found")
              return source.replace(old, new, 1)

          service = service_path.read_text(encoding="utf-8")
          if "TOP_LEFT_CALIBRATION_FLOW_V1" not in service:
              service = rep(
                  service,
                  '        prefs = getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);\n        showControlPanel();',
                  '        prefs = getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);\n'
                  '        if (!prefs.getBoolean("overlay_top_left_default_v1", false)) {\n'
                  '            prefs.edit().putInt("overlay_x", dp(6)).putInt("overlay_y", dp(6))\n'
                  '                    .putBoolean("overlay_top_left_default_v1", true).apply();\n'
                  '        }\n'
                  '        showControlPanel();',
                  "one-time top-left position migration")
              service = service.replace(
                  "controlParams.gravity = Gravity.BOTTOM | Gravity.LEFT;",
                  "controlParams.gravity = Gravity.TOP | Gravity.LEFT;")
              service = rep(
                  service,
                  '        controlParams.y = Math.max(0, Math.min(screenHeight - dp(44), prefs.getInt("overlay_y", dp(4))));',
                  '        controlParams.y = Math.max(0, Math.min(screenHeight - dp(92), prefs.getInt("overlay_y", dp(6))));',
                  "control panel top-left default")
              service = rep(
                  service,
                  '                            controlParams.y = Math.max(0, Math.min(m.heightPixels - window.getHeight(), startY - Math.round(dy)));',
                  '                            controlParams.y = Math.max(0, Math.min(m.heightPixels - window.getHeight(), startY + Math.round(dy)));',
                  "control panel drag direction")
              service = rep(
                  service,
                  '''        if ((controlResizeEdges & NoteRollView.EDGE_TOP) != 0) {
                      height = controlGestureStartHeight - dy;
                      controlParams.y = controlGestureStartY;
                      controlHeightUserSized = true;
                  }
                  if ((controlResizeEdges & NoteRollView.EDGE_BOTTOM) != 0) {
                      height = controlGestureStartHeight + dy;
                      y = controlGestureStartY - dy;
                      controlHeightUserSized = true;
                  }''',
                  '''        if ((controlResizeEdges & NoteRollView.EDGE_TOP) != 0) {
                      height = controlGestureStartHeight - dy;
                      y = controlGestureStartY + dy;
                      controlHeightUserSized = true;
                  }
                  if ((controlResizeEdges & NoteRollView.EDGE_BOTTOM) != 0) {
                      height = controlGestureStartHeight + dy;
                      y = controlGestureStartY;
                      controlHeightUserSized = true;
                  }''',
                  "top-gravity resize behavior")
              service = rep(
                  service,
                  '        if ((controlResizeEdges & NoteRollView.EDGE_BOTTOM) != 0) controlParams.y = Math.max(0, y);',
                  '        if ((controlResizeEdges & (NoteRollView.EDGE_TOP | NoteRollView.EDGE_BOTTOM)) != 0) controlParams.y = Math.max(0, y);',
                  "apply top/bottom resize position")
              service = rep(
                  service,
                  '                            controlParams.y = Math.max(0, Math.min(m.heightPixels - dp(44), originY - Math.round(dy)));',
                  '                            controlParams.y = Math.max(0, Math.min(m.heightPixels - dp(44), originY + Math.round(dy)));',
                  "collapsed bubble drag direction")
              service = rep(
                  service,
                  '    public void prepareCalibration() {',
                  '''    private boolean isCurrentLayoutCalibrated() {
                      if (InstrumentLayout.MODE_PIANO88.equals(InstrumentLayout.selectedMode(prefs))) {
                          return InstrumentLayout.isPiano88Calibrated(prefs);
                      }
                      return InstrumentLayout.calibratedCount(prefs) == InstrumentLayout.PITCHES.length;
                  }

                  public void prepareCalibration() {''',
                  "layout calibration status helper")
              service = rep(
                  service,
                  '''        Button play = smallButton("开始");
                  pauseButton = new TextView(this);''',
                  '''        boolean calibrated = isCurrentLayoutCalibrated();
                  Button play = smallButton("开始");
                  pauseButton = new TextView(this);''',
                  "calibration-only control state")
              service = rep(
                  service,
                  '''        panel.addView(play, flowButtonParams());
                  panel.addView(pauseButton, flowButtonParams());
                  panel.addView(stop, flowButtonParams());
                  panel.addView(songs, flowButtonParams());
                  panel.addView(segment, flowButtonParams());
                  panel.addView(roll, flowButtonParams());
                  panel.addView(calibrate, flowButtonParams());
                  panel.addView(hide, flowButtonParams());
                  play.setOnClickListener(v -> startPlayback());
                  pauseButton.setOnClickListener(v -> togglePause());
                  stop.setOnClickListener(v -> stopPlayback());
                  songs.setOnClickListener(v -> showSongPickerDialog());
                  segment.setOnClickListener(v -> beginRangeEditingFromControl());
                  roll.setOnClickListener(v -> toggleNoteRoll());
                  calibrate.setOnClickListener(v -> beginCalibration());
                  hide.setOnClickListener(v -> collapseControlPanel());''',
                  '''        if (calibrated) {
                      panel.addView(play, flowButtonParams());
                      panel.addView(pauseButton, flowButtonParams());
                      panel.addView(stop, flowButtonParams());
                      panel.addView(songs, flowButtonParams());
                      panel.addView(segment, flowButtonParams());
                      panel.addView(roll, flowButtonParams());
                  } else {
                      pauseButton = null;
                  }
                  panel.addView(calibrate, flowButtonParams());
                  panel.addView(hide, flowButtonParams());
                  if (calibrated) {
                      play.setOnClickListener(v -> startPlayback());
                      pauseButton.setOnClickListener(v -> togglePause());
                      stop.setOnClickListener(v -> stopPlayback());
                      songs.setOnClickListener(v -> showSongPickerDialog());
                      segment.setOnClickListener(v -> beginRangeEditingFromControl());
                      roll.setOnClickListener(v -> toggleNoteRoll());
                  }
                  calibrate.setOnClickListener(v -> beginCalibration());
                  hide.setOnClickListener(v -> collapseControlPanel());''',
                  "only show calibration before layout is ready")
              service = rep(
                  service,
                  '''            int defaultHeight = Math.min(maxHeight, dp(112));
                      boolean noteLayoutV3 = prefs.getBoolean("note_roll_layout_v3", false);''',
                  '''            int defaultHeight = Math.min(maxHeight, dp(132));
                  if (!prefs.getBoolean("note_roll_header_layout_v4", false)) {
                      int savedHeight = prefs.getInt("note_roll_height_px", -1);
                      if (savedHeight > 0 && savedHeight <= dp(118)) {
                          prefs.edit().putInt("note_roll_height_px", defaultHeight).apply();
                      }
                      prefs.edit().putBoolean("note_roll_header_layout_v4", true).apply();
                  }
                  boolean noteLayoutV3 = prefs.getBoolean("note_roll_layout_v3", false);''',
                  "space for title and segment row")
              service = service.replace(
                  "COLLAPSED_MUSIC_STATUS_BUBBLE_V1 */",
                  "COLLAPSED_MUSIC_STATUS_BUBBLE_V1 TOP_LEFT_CALIBRATION_FLOW_V1 */")
              service_path.write_text(service, encoding="utf-8")

          note = note_path.read_text(encoding="utf-8")
          if "NOTE_HEADER_INFO_V2" not in note and "final float top = 8 * density;" in note:
              note = rep(note, "        final float top = 8 * density;", "        final float top = 52 * density;",
                         "move note field below title, time and segment")
              note = rep(
                  note,
                  '''        // The visual playhead line is intentionally hidden; note fade still uses its anchor.

                  if (scrubbing) {''',
                  '''        // Low-contrast playhead line restored without a background strip.
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setColor(0x66ffffff);
                  paint.setStrokeWidth(1.15f * density);
                  canvas.drawLine(playheadX, top, playheadX, bottom, paint);
                  paint.setStrokeWidth(1f * density);
                  paint.setStyle(Paint.Style.FILL);

                  if (scrubbing) {''',
                  "restore subtle playhead")
              header_start = note.find("    private void drawHeaderOverlay(")
              header_end = note.find("    private void drawHeaderChip(", header_start)
              if header_start < 0 or header_end < 0:
                  raise SystemExit("Cannot find note header boundaries.")
              new_header = "\n".join([
                  '    private void drawHeaderOverlay(Canvas canvas, float w, float h, float density) {',
                  '        // Header text shares the blank transparent background with the notes.',
                  '        float left = 8 * density;',
                  '        float titleMaxWidth = Math.max(12 * density, w - 65 * density);',
                  '        paint.setStyle(Paint.Style.FILL);',
                  '        paint.setFakeBoldText(true);',
                  '        paint.setTextSize(9.5f * density);',
                  '        paint.setColor(0xfff2f5f4);',
                  '        CharSequence visibleTitle = android.text.TextUtils.ellipsize(',
                  '                title, new android.text.TextPaint(paint), titleMaxWidth,',
                  '                android.text.TextUtils.TruncateAt.END);',
                  '        canvas.drawText(visibleTitle.toString(), left, 14 * density, paint);',
                  '        paint.setFakeBoldText(false);',
                  '        paint.setTextSize(8.2f * density);',
                  '        paint.setColor(0xccebf0f0);',
                  '        String time = formatTime(positionMicros) + " / " + formatTime(durationMicros);',
                  '        CharSequence visibleTime = android.text.TextUtils.ellipsize(',
                  '                time, new android.text.TextPaint(paint), titleMaxWidth,',
                  '                android.text.TextUtils.TruncateAt.END);',
                  '        canvas.drawText(visibleTime.toString(), left, 27 * density, paint);',
                  '',
                  '        float buttonTop = 5 * density;',
                  '        float buttonBottom = Math.min(25 * density, h - 4 * density);',
                  '        drawHeaderChip(canvas, new RectF(w - 61 * density, buttonTop, w - 35 * density, buttonBottom),',
                  '                playing ? "Ⅱ" : "▶", playing ? 0xff4c8d80 : 0xff455667, density);',
                  '        drawHeaderChip(canvas, new RectF(w - 32 * density, buttonTop, w - 6 * density, buttonBottom),',
                  '                "×", 0xff455667, density);',
                  '        // Keep segment selection below the metadata, far from the close target.',
                  '        drawHeaderChip(canvas, new RectF(left, 32 * density, left + 39 * density, 49 * density),',
                  '                rangeEditing ? "完成" : "片段", rangeEditing ? 0xff4c8d80 : 0xff455667, density);',
                  '    }',
                  ''
              ]) + "\n"
              note = note[:header_start] + new_header + note[header_end:]
              touch_start = note.find("                if (y < 34 * density && x > w - 34 * density) {")
              touch_end = note.find("                } else if (touchEdges != 0) {", touch_start)
              if touch_start < 0 or touch_end < 0:
                  raise SystemExit("Cannot find note-roll header touch boundaries.")
              new_touch = "\n".join([
                  '                if (y < 29 * density && x > w - 34 * density) {',
                  '                    touchMode = TOUCH_CLOSE;',
                  '                } else if (y < 29 * density && x > w - 63 * density) {',
                  '                    touchMode = TOUCH_PLAY_PAUSE;',
                  '                } else if (y >= 30 * density && y < 51 * density',
                  '                        && x >= 5 * density && x <= 52 * density) {',
                  '                    touchMode = TOUCH_SEGMENT;'
              ]) + "\n"
              note = note[:touch_start] + new_touch + note[touch_end:]
              note = note.replace(
                  "/** Compact, resizable and seekable MIDI roll overlay. */",
                  "/** Compact, resizable and seekable MIDI roll overlay. NOTE_HEADER_INFO_V2 */")
              note_path.write_text(note, encoding="utf-8")
          elif "NOTE_HEADER_INFO_V2" not in note:
              # The current v3 note-roll already has title/time, the faint playhead,
              # and the segment row. Avoid applying old absolute-layout anchors again.
              if "drawHeaderOverlay(Canvas canvas" not in note or "0x66ffffff" not in note or 'rangeEditing ? "完成" : "片段"' not in note:
                  raise SystemExit("Current note-roll header lacks expected v3 controls.")
              note = note.replace(
                  "/** Compact resizable MIDI roll with icon-anchored controls. ICON_ANCHORED_HEADER_V3 */",
                  "/** Compact resizable and seekable MIDI roll with icon-anchored controls. ICON_ANCHORED_HEADER_V3 NOTE_HEADER_INFO_V2 */")
              note_path.write_text(note, encoding="utf-8")

          service = service_path.read_text(encoding="utf-8")
          note = note_path.read_text(encoding="utf-8")
          if "TOP_LEFT_CALIBRATION_FLOW_V1" not in service:
              raise SystemExit("Top-left/calibration marker missing.")
          if "NOTE_HEADER_INFO_V2" not in note:
              raise SystemExit("Note header marker missing.")
          if "0x66ffffff" not in note or "rangeEditing ? \"完成\" : \"片段\"" not in note:
              raise SystemExit("Subtle playhead or new segment-row UI not present.")
          print("Applied top-left overlay, calibration-only controls, transparent note metadata, subtle playhead and second-row segment button.")
          PY

      - name: Polish icon-anchored panel and inline note-roll header
        run: |
          SERVICE=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'ICON_ANCHORED_HEADER_V3' "$NOTE_VIEW"; then
            cat .github/patches/overlay-polish-v3.part-*.txt | tr -d '\r\n\t ' > /tmp/overlay-polish-v3.patch.gz.b64
            base64 --decode /tmp/overlay-polish-v3.patch.gz.b64 > /tmp/overlay-polish-v3.patch.gz
            gzip -t /tmp/overlay-polish-v3.patch.gz
            gzip -dc /tmp/overlay-polish-v3.patch.gz > /tmp/overlay-polish-v3.patch
            patch --dry-run -p1 < /tmp/overlay-polish-v3.patch
            patch -p1 < /tmp/overlay-polish-v3.patch
          else
            echo "Icon-anchored panel and inline note header are already applied."
          fi
          grep -q 'dragTitle.setText("♫")' "$SERVICE"
          ! grep -q 'Button hide = smallButton("收起")' "$SERVICE"
          grep -q 'ICON_ANCHORED_HEADER_V3' "$NOTE_VIEW"

      - name: Restore icon-only collapse and fill transparent upper note space
        run: |
          SERVICE=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          if ! grep -q 'COLLAPSE_TO_MUSIC_ICON_V1' "$SERVICE" || ! grep -q 'UPPER_RIGHT_NOTE_SPACE_V2' "$NOTE_VIEW"; then
            python .github/scripts/restore_collapsed_icon_and_use_top_right_note_space.py
          else
            echo "Icon-only collapse and upper note-space layout are already applied."
          fi

      - name: Apply A/B loop settings UI and remove RocoMusic navigation
        run: |
          SERVICE=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java
          NOTE_VIEW=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/NoteRollView.java
          MAIN_ACTIVITY=LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MainActivity.java
          if ! grep -q 'AB_LOOP_SETTINGS_V1' "$SERVICE" || ! grep -q 'AB_LOOP_SETTINGS_V1' "$NOTE_VIEW"; then
            cat .github/patches/ab-loop-v1.part-*.txt | tr -d '\r\n\t ' > /tmp/ab-loop-v1.patch.gz.b64
            base64 --decode /tmp/ab-loop-v1.patch.gz.b64 > /tmp/ab-loop-v1.patch.gz
            gzip -t /tmp/ab-loop-v1.patch.gz
            gzip -dc /tmp/ab-loop-v1.patch.gz > /tmp/ab-loop-v1.patch
            patch --dry-run -p1 < /tmp/ab-loop-v1.patch
            patch -p1 < /tmp/ab-loop-v1.patch
          else
            echo "A/B loop settings and playback are already applied."
          fi
          # Uri is still required for Android's MIDI file picker; only the RocoMusic integration was removed.
          if ! grep -q '^import android.net.Uri;' "$MAIN_ACTIVITY"; then
            sed -i '/^import android.content.Intent;$/a import android.net.Uri;' "$MAIN_ACTIVITY"
          fi
          # Remove the obsolete range-edit stub so only the new settings-card method remains.
          python - <<'PY'
          from pathlib import Path
          p = Path("LuokeAutoPiano/app/src/main/java/com/luoke/autopiano/MusicAccessibilityService.java")
          s = p.read_text(encoding="utf-8")
          old_start = s.find("    // SEGMENT_EDIT_IN_ROLL_ONLY_V1:")
          if old_start >= 0:
              old_end = s.find("    private Button dialogButton(", old_start)
              if old_end < 0:
                  raise SystemExit("Couldn't find the old segment stub end.")
              s = s[:old_start] + s[old_end:]
              p.write_text(s, encoding="utf-8")
          if s.count("private void showSegmentDialog()") != 1:
              raise SystemExit("Expected exactly one A/B settings dialog method.")
          PY
          ! grep -qi 'rocomusic' "$MAIN_ACTIVITY"
          grep -q '^import android.net.Uri;' "$MAIN_ACTIVITY"
          grep -q 'A/B循环已开启' "$SERVICE"
          grep -q 'A/B循环' "$NOTE_VIEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: LuokeAutoPiano
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Run JVM tests
        working-directory: LuokeAutoPiano
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-debug-apk
          path: LuokeAutoPiano/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package optimized source archive
        run: |
          find LuokeAutoPiano -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          rm -f /tmp/LuokeAutoPiano.zip
          zip -qr -9 /tmp/LuokeAutoPiano.zip LuokeAutoPiano
          unzip -tq /tmp/LuokeAutoPiano.zip
          cp /tmp/LuokeAutoPiano.zip LuokeAutoPiano.zip

      - name: Upload optimized source archive
        uses: actions/upload-artifact@v4
        with:
          name: LuokeAutoPiano-source-zip
          path: LuokeAutoPiano.zip
          if-no-files-found: error

      - name: Sync optimized source archive back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch video-patch video-patch-b64 overlay-patch-b64 .github/patches .github/scripts/apply_note_roll_header_v1.py .github/scripts/restore_collapsed_icon_and_use_top_right_note_space.py
          git add LuokeAutoPiano.zip
          if ! git diff --cached --quiet; then
            git commit -m "Sync seekable music overlay source [skip ci]"
            git push origin HEAD:main
          else
            echo "No source archive changes to sync."
          fi
